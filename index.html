<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D &amp; S – Wedding Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Pinyon+Script&family=Jost:wght@300;400&display=swap">
<link rel="stylesheet" href="style.css">

</head><body class="lock">
<div id="env">
 <img class="f fl" src="images/left.webp" alt="">
 <img class="f fr" src="images/right.webp" alt="">
 <img class="f fb" src="images/bottom.webp" alt="">
 <img class="f ft" src="images/top.webp" alt="">
 <div id="ring"></div><img id="seal" src="images/seal2.webp" alt="Tap to open">
 <div id="hint" class="cap">Tap to open</div>
</div>

<div id="pearls"></div><div id="bar"></div><main id="app"></main><button id="eb">✎ EDIT</button><div id="ep"></div>

<script id="data" type="application/json">
{
  "intro": "Mr. and Mrs. M. Nasir cordially invite you to the wedding of their Beloved Daughter",
  "n1": "Sarah Nasir",
  "n2": "Syed M. Daud Hadi",
  "f1": "Daughter of Muhammad Nasir Sb",
  "f2": "Son of Syed Iftikhar Hussain Shah Sb",
  "line": "Request the pleasure of your company at their wedding celebration",
  "dateText": "22 · 12 · 2026",
  "iso": "2026-12-22T17:00",
  "venue": "Qasar e Ashraf Marquee, Sialkot",
  "address": "Qasar-e-Ashraf Marquee Karimi Chak, Sialkot",
  "mapQ": "Qasar-e-Ashraf Marquee Karimi Chak, Sialkot",
  "dress": "Formal Attire",
  "dressNote": "Dress beautifully, feel comfortable, and come ready to celebrate with us.",
  "rsvpBy": "Kindly reply by 1 Dec 2026",
  "wa": "923016182592",
  "closing": "S & D",
  "groups": {
    "all": ["mehndi", "wedding", "walima"],
    "mehndi-wedding": ["mehndi", "wedding"],
    "wedding": ["wedding"],
    "wedding-walima": ["wedding", "walima"]
  },
  "events": [
    {
      "id": "mehndi",
      "name": "Mehndi",
      "date": "20 Dec 2026",
      "time": "7:00 PM",
      "venue": "Mehndi Venue",
      "address": "Street address, City",
      "mapQ": "Mehndi Venue City",
      "dress": "Yellow & Green",
      "sched": [
        ["7:00 PM", "Guests arrive", "Welcome drinks"],
        ["8:00 PM", "Mehndi ceremony", "Henna & music"],
        ["10:00 PM", "Dinner", "Dinner is served"]
      ]
    },
    {
      "id": "wedding",
      "name": "Wedding",
      "date": "22 Dec 2026",
      "time": "2:00 PM",
      "venue": "Qasar e Ashraf Marquee, Sialkot",
      "address": "Qasar-e-Ashraf Marquee Karimi Chak, Sialkot",
      "mapQ": "Qasar-e-Ashraf Marquee Karimi Chak, Sialkot",
      "dress": "Semi-Formal",
      "sched": [
        ["2:00 PM", "Welcome", "Barat & greetings"],
        ["3:00 PM", "Ceremony", "The vows"],
        ["4:00 PM", "Lunch", "Lunch & Prayers"],
        ["5:00 PM", "Rukhsati", "Farewell & sendoff"]
      ]
    },
    {
      "id": "walima",
      "name": "Walima",
      "date": "23 Dec 2026",
      "time": "7:30 PM",
      "venue": "Walima Venue",
      "address": "Street address, City",
      "mapQ": "Walima Venue City",
      "dress": "Formal Attire",
      "sched": [
        ["7:30 PM", "Guests arrive", "Welcome"],
        ["8:30 PM", "Dinner", "Dinner is served"],
        ["10:00 PM", "Farewell", "Thank you for coming"]
      ]
    }
  ]
}
</script>
<script>
var D=JSON.parse(document.getElementById('data').textContent),$=function(i){return document.getElementById(i)};
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sp(s){return Array.from(s).map(function(c,i){return'<span class="ch" style="--i:'+i+'">'+(c==' '?'&nbsp;':e(c))+'</span>'}).join('')}
function tlf(s){return s&&s.length?'<div class="tl">'+s.map(function(r){return'<div><em>'+e(r[0])+'</em><strong>'+e(r[1])+'</strong>'+e(r[2])+'</div>'}).join('')+'</div>':''}
function render(){
 var g=location.hash.slice(1),ids=(D.groups||{})[g];
 var evs=D.events.filter(function(v){return!ids||ids.indexOf(v.id)>-1}).map(function(v){return'<div class="ev"><div class="cap">'+e(v.date)+' · '+e(v.time)+'</div><h2 class="script">'+e(v.name)+'</h2><p>'+e(v.venue)+'</p><p>'+e(v.address)+'</p>'+(v.dress?'<p class="cap" style="margin-top:14px">Dress: '+e(v.dress)+'</p>':'')+(v.sched&&v.sched.length?'<div class="cap" style="margin-top:22px">Schedule</div>':'')+tlf(v.sched)+'<a class="btn" href="https://maps.google.com/?q='+encodeURIComponent(v.mapQ)+'" target="_blank" rel="noopener">View on map</a></div>'}).join('');
 $('app').innerHTML=
 '<section class="sec"><img class="bis" src="images/bismillah.png" alt="Bismillah"><div class="cap">'+e(D.intro)+'</div><div class="names script"><div class="nm">'+sp(D.n1)+'</div><div class="fn">'+e(D.f1)+'</div><span class="amp">&amp;</span><div class="nm">'+sp(D.n2)+'</div><div class="fn">'+e(D.f2)+'</div></div><p>'+e(D.line)+'</p><p class="cap" style="margin-top:22px">'+e(D.dateText)+'</p><p>'+e(D.venue)+'</p><div class="cap dn">↓</div></section>'+
 '<section class="sec"><div class="cap">Countdown to the wedding</div><h2 class="script">Are you ready?</h2><div class="cd"><div><b id="d">0</b><span>Days</span></div><div><b id="h">0</b><span>Hours</span></div><div><b id="m">0</b><span>Mins</span></div><div><b id="s">0</b><span>Secs</span></div></div></section>'+
 '<section class="sec"><div class="cap">Join us for</div><h2>Celebrations</h2>'+evs+'</section>'+
 '<section class="sec"><div class="frame"><div class="cap">Dress code</div><h2 class="script">'+e(D.dress)+'</h2><p>'+e(D.dressNote)+'</p></div></section>'+
 '<section class="sec"><div class="cap">'+e(D.rsvpBy)+'</div><h2 class="script">RSVP</h2><p>We can’t wait to celebrate with you.</p><img class="seal2" src="'+$('seal').src+'" alt=""><br><a class="btn" href="https://wa.me/'+e(String(D.wa).replace(/\D/g,''))+'?text=Hello!%20I%20will%20attend." target="_blank" rel="noopener">Reply on WhatsApp</a><p style="margin-top:28px">With love,</p><div class="names script" style="font-size:clamp(30px,10vw,44px)">'+e(D.closing)+'</div></section>';
 document.querySelectorAll('.sec > *:not(.names),.tl > div,.cd > div,.fn').forEach(function(x,i){x.classList.add('rv');x.style.setProperty('--i',x.parentNode.classList.contains('sec')?Array.prototype.indexOf.call(x.parentNode.children,x):i%4)});
}
var T,last={};
function tick(){var t=Math.max(0,T-Date.now()),v={d:Math.floor(t/864e5),h:Math.floor(t%864e5/36e5),m:Math.floor(t%36e5/6e4),s:Math.floor(t%6e4/1e3)};
 for(var k in v){var n=$(k);if(n&&last[k]!==v[k]){n.textContent=v[k];n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop');last[k]=v[k]}}}
function start(){var io=new IntersectionObserver(function(a){a.forEach(function(x){if(x.isIntersecting)x.target.classList.add('in')})},{threshold:.2});
 document.querySelectorAll('.sec').forEach(function(s){io.observe(s)});T=new Date(D.iso).getTime();tick();setInterval(tick,1000)}
function pearls(){var p=$('pearls');for(var i=0;i<16;i++){var s=document.createElement('i'),z=4+Math.random()*7;s.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';p.appendChild(s)}}
var env=$('env'),opened=0;
function openEnv(skip){if(opened)return;opened=1;if(skip){env.style.display='none';document.body.classList.remove('lock');start();return}
 env.classList.add('open');setTimeout(function(){env.style.display='none';document.body.classList.remove('lock');start()},1500)}
env.addEventListener('click',function(){openEnv(0)});
window.addEventListener('scroll',function(){var h=document.documentElement;$('bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});
function fit(){document.querySelectorAll('.nm').forEach(function(n){n.style.fontSize='';var f=parseFloat(getComputedStyle(n).fontSize);while(n.scrollWidth>n.clientWidth&&f>18){f-=2;n.style.fontSize=f+'px'}})}
render();fit();addEventListener('resize',fit);pearls();
try{if(sessionStorage.getItem('skip')){sessionStorage.removeItem('skip');openEnv(1)}}catch(x){}
/* editor */
var F=[['intro','Top line'],['n1','First name'],['n2','Second name'],['f1','Father line under first name (e.g. Son of Mr. Ahmed)'],['f2','Father line under second name (e.g. Daughter of Mr. Ali)'],['line','Invitation sentence'],['dateText','Date (as shown)'],['iso','Countdown date & time','datetime-local'],['venue','Venue name'],['address','Address'],['mapQ','Map search words'],['dress','Dress code'],['dressNote','Dress code note'],['rsvpBy','RSVP deadline text'],['wa','WhatsApp number (country code, digits only)'],['closing','Sign-off names']];
function openEd(){var h='<h3>Edit your invitation</h3>';F.forEach(function(f){h+='<label>'+f[1]+'</label><input data-k="'+f[0]+'" type="'+(f[2]||'text')+'" value="'+e(D[f[0]])+'">'});
 h+='<label>Events (Mehndi, Wedding, Walima…)</label><div id="evs"></div><button class="bt o" id="addev">+ ADD EVENT</button><br><button class="bt" id="sv">SAVE &amp; PUBLISH</button><button class="bt o" id="cx">CANCEL</button><p id="st" style="font-size:15px"></p>';
 $('ep').innerHTML=h;$('ep').style.display='block';D.events.forEach(evRow);
 $('addev').onclick=function(){evRow({})};$('cx').onclick=function(){$('ep').style.display='none'};$('sv').onclick=save}
function row(r,box){var d=document.createElement('div');d.className='row';d.innerHTML=[0,1,2].map(function(i){return'<input value="'+e(r[i])+'">'}).join('')+'<button class="bt o" style="margin:0;padding:0">✕</button>';d.lastChild.onclick=function(){d.remove()};box.appendChild(d)}
var EK=[['id','Short ID (no spaces, e.g. mehndi)'],['name','Event name'],['date','Date'],['time','Time'],['venue','Venue'],['address','Address'],['mapQ','Map search words'],['dress','Dress code (optional)']];
function evRow(v){var d=document.createElement('div');d.className='evbox';d.innerHTML=EK.map(function(k){return'<label>'+k[1]+'</label><input data-e="'+k[0]+'" value="'+e(v[k[0]])+'">'}).join('')+'<label>Schedule (time · title · note)</label><div class="sr"></div><button class="bt o ar" style="margin:6px 8px 0 0">+ ADD ROW</button><button class="bt o" style="margin:6px 0 0">REMOVE EVENT</button>';var sr=d.querySelector('.sr');(v.sched||[]).forEach(function(r){row(r,sr)});d.querySelector('.ar').onclick=function(){row(['','',''],sr)};d.lastChild.onclick=function(){d.remove()};$('evs').appendChild(d)}
async function save(){$('st').textContent='Saving…';
 document.querySelectorAll('#ep [data-k]').forEach(function(i){D[i.dataset.k]=i.value});
 D.events=Array.prototype.map.call(document.querySelectorAll('#evs .evbox'),function(b){var o={};b.querySelectorAll('input[data-e]').forEach(function(i){o[i.dataset.e]=i.value});o.sched=Array.prototype.map.call(b.querySelectorAll('.sr .row'),function(r){return Array.prototype.map.call(r.querySelectorAll('input'),function(i){return i.value})});return o});
 var c=document.documentElement.cloneNode(true);['app','ep','pearls'].forEach(function(i){c.querySelector('#'+i).innerHTML=''});
 var en=c.querySelector('#env');en.className='';en.removeAttribute('style');c.querySelector('body').className='lock';c.querySelector('#eb').removeAttribute('style');c.querySelector('#ep').removeAttribute('style');
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 try{sessionStorage.setItem('skip','1')}catch(x){}
 try{var a=await claude.use('artifact');if(!a)throw 0;await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(x){$('st').textContent='Could not save. Please open the link while signed in to your Claude account.'}}
$('eb').onclick=openEd;
if(window.claude)claude.use('user').then(function(u){if(u&&u.isOwner())$('eb').style.display='block'}).catch(function(){});
</script>

</body>
</html>
